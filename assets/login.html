<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ecobazar Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="row justify-content-center align-items-center vh-100">

            <div class="col-lg-5">

                <div class="card auth-card shadow">

                    <div class="card-body">

                        <div class="text-center">

                            <img src="assets/images/Logo.png" width="180">

                            <h3 class="mt-3">Welcome Back</h3>

                            <p>Login to continue shopping</p>

                        </div>

                        <!-- LOGIN FORM -->

                        <form id="loginForm">

                            <div class="mb-3">

                                <label>Email</label>

                                <input type="email" class="form-control" id="loginEmail" required>

                            </div>

                            <div class="mb-3">

                                <label>Password</label>

                                <div class="input-group">

                                    <input type="password" class="form-control" id="loginPassword" required>

                                    <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePassword('loginPassword',this)">

                                        <i class="fa-solid fa-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <div class="d-flex justify-content-between">

                                <div>

                                    <input type="checkbox">

                                    Remember me

                                </div>

                                <a href="#">Forgot Password?</a>

                            </div>

                            <button class="btn btn-success w-100 mt-4">

                                Login

                            </button>

                        </form>

                        <hr>

                        <p class="text-center">

                            Don't have an account?

                            <a href="#" id="showSignup">

                                Create One

                            </a>

                        </p>

                        <!-- SIGNUP -->

                        <form id="signupForm" style="display:none;">

                            <div class="mb-3">

                                <label>Full Name</label>

                                <input type="text" class="form-control" required>

                            </div>

                            <div class="mb-3">

                                <label>Email</label>

                                <input type="email" class="form-control" required>

                            </div>

                            <div class="mb-3">

                                <label>Password</label>

                                <div class="input-group">

                                    <input type="password" class="form-control" id="signupPassword" required>

                                    <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePassword('signupPassword',this)">

                                        <i class="fa-solid fa-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <div class="mb-3">

                                <label>Confirm Password</label>

                                <input type="password" class="form-control" id="confirmPassword" required>

                            </div>

                            <button class="btn btn-success w-100">

                                Create Account

                            </button>

                        </form>

                        <p class="text-center mt-3" id="backLogin" style="display:none;">

                            Already have an account?

                            <a href="#">

                                Login

                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="assets/js/login.js"></script>

</body>

</html>
